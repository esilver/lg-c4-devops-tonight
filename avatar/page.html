<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Avatar Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The screening room of the lip-sync demo, turned into a call: the picture leads, the conversation sits under it,
     amber marks whatever is live. One column, 800 px at most. One world, so one theme. */
  :root {
    color-scheme: dark;
    --bg: #171b21; --panel: #20262e; --line: #343d49; --ink: #ece9e2; --muted: #9aa4b0; --accent: #f2b23e;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
  main { max-width: 832px; margin: 0 auto; padding: 20px 16px 36px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); max-width: 68ch; font-size: 15px; }
  .stage { position: relative; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; background: #000; border-radius: 8px; }
  #state { position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; background: rgba(12, 15, 19, .78); font: 500 12.5px var(--data); letter-spacing: .04em; text-transform: uppercase; }
  #state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #state[data-s=speaking]::before, #state[data-s=listening]::before { background: var(--accent); }
  #state[data-s=thinking]::before { background: var(--accent); animation: blip 1s infinite; }
  @keyframes blip { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { #state[data-s=thinking]::before { animation: none; } }
  #cap { margin: 0; min-height: 3em; font-size: 18px; line-height: 1.45; color: var(--muted); text-wrap: pretty; }
  #cap b { color: var(--ink); font-weight: 500; }
  form { display: flex; flex-wrap: wrap; gap: 8px; }
  #say { flex: 1 1 240px; min-width: 0; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; }
  button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #send { font-weight: 600; background: var(--accent); color: #1a1407; border-color: var(--accent); }
  button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 14px; }
  .row label { display: inline-flex; gap: 8px; align-items: center; }
  .row label[hidden] { display: none; }
  #log { display: grid; gap: 8px; margin: 0; padding: 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-height: 260px; overflow-y: auto; font-size: 15px; }
  #log:empty { display: none; }
  #log li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; }
  #log span { font: 500 12px var(--data); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  .note { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 76ch; }
  .note a { color: var(--ink); }
  #tech { color: var(--muted); font-size: 13px; }
  #tech summary { cursor: pointer; }
  #tech pre { margin: 6px 0 0; font: 12.5px/1.5 var(--data); white-space: pre-wrap; overflow-wrap: anywhere; }
  #add { display: grid; gap: 8px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
  #add[hidden] { display: none; }
  .pick { display: inline-flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }
  .pick input { font: inherit; color: var(--ink); max-width: 100%; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Live Avatar Demo</h1>
    <p>Say or type something and the avatar answers out loud. The reply comes from Claude, the face is one photograph, and the lips are timed by the model that makes the voice.</p>
  </header>
  <div class="stage">
    <canvas id="screen" width="768" height="576" aria-label="The avatar"></canvas>
    <span id="state" data-s="idle" aria-live="polite">Loading</span>
  </div>
  <p id="cap" aria-live="polite"></p>
  <form id="talk" autocomplete="off">
    <input id="say" type="text" placeholder="Type something to say" aria-label="What you say" maxlength="500">
    <button id="send" type="submit">Send</button>
    <button id="mic" type="button" aria-pressed="false" hidden title="Hands-free: click once, then just talk">Speak</button>
    <button id="stop" type="button" hidden>Stop</button>
  </form>
  <div class="row">
    <label for="voice" id="voiceRow" hidden>Voice <select id="voice"></select></label>
    <span id="how"></span>
  </div>
  <details id="tech" hidden><summary>Voice details</summary><pre id="techText"></pre></details>
  <div id="add" hidden>
    <p class="note" id="addWhy"></p>
    <label class="pick">Add the files <input id="files" type="file" multiple accept=".onnx,.bin,.wasm"></label>
  </div>
  <ol id="log" aria-label="Conversation"></ol>
  <p class="note" id="note"></p>
</main>
<script>
'use strict';
// The bulletin's own engine (below, unchanged) draws the face. This page adds the live part: a reply from Claude, a
// voice, and a clock that keeps the mouth with the voice. The voice is the avatar's own where it can be: a speech model
// run on this device by voice/worker.js, which reports when every sound happens, so the lips are exact. Where that
// cannot start, a voice of Claude's or the browser's speaks instead and the mouth is estimated from the spelling.
const SW = 1024, SH = 576, scr = document.getElementById('screen'), c = scr.getContext('2d');
const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
let switchedAt = -10;
/*NEWS*/
/* ───────────────────────── Live ───────────────────────── */
const WHO = Object.keys(ASSETS.cast)[0], $ = id => document.getElementById(id);
const T0 = performance.now(), wall = () => performance.now() / 1000, clock = () => (performance.now() - T0) / 1000;      // the show's clock starts when the page does
const PRE = 0.1, PACE = 13;                    // seconds of a line before its first sound; letters a second the voice is assumed to speak
// Real speech is quicker than the estimate, and the engine opens the jaw less for a sound that is over sooner: with the
// voice's own times the jaw reached 0.57 at the 90th percentile against 0.66 with estimated ones. This brings it back.
const OPEN = 1.16;
const FACE = /*FACE*/{ voice: 'af_heart', persona: '', note: '' };          // whose face this is, what to say about it, and its usual voice (build.py fills it in)
const PERSONA = `You are the avatar on screen in a live avatar demo. ${FACE.persona} You are speaking out loud, so answer in one or two short sentences of plain spoken English. No lists, no markdown, no emoji, no stage directions. Write numbers as words.`;

/* ── from a sentence to the sounds a mouth makes, when the voice does not say ──
   Only for a borrowed voice (Claude's, the browser's). A rough guess at English pronunciation from spelling. It does not need to get the word right, only the mouth: where
   the lips meet (p, b, m), where they round (w, oo, oh), where the jaw drops (ah). Symbols are the engine's own. */
const DIGIT = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
const PAIR = { th: ['θ'], sh: ['ʃ'], ch: ['ʧ'], ph: ['f'], wh: ['w'], ck: ['k'], ng: ['ŋ'], qu: ['k', 'w'], gh: [], kn: ['n'], wr: ['ɹ'],
  ee: ['i:'], ea: ['i:'], ie: ['i:'], oo: ['u:'], ou: ['W:'], ow: ['W:'], ai: ['A:'], ay: ['A:'], ei: ['A:'], ey: ['A:'], oi: ['Y:'], oy: ['Y:'],
  au: ['ɔ:'], aw: ['ɔ:'], oa: ['O:'], ar: ['ɑ:', 'ɹ'], or: ['ɔ:', 'ɹ'], er: ['ɜ', 'ɹ'], ir: ['ɜ', 'ɹ'], ur: ['ɜ', 'ɹ'] };
const ONE = { a: 'æ', e: 'ɛ', i: 'ɪ', o: 'ɑ', u: 'ʌ', b: 'b', d: 'd', f: 'f', h: 'h', j: 'ʤ', k: 'k', l: 'l', m: 'm', n: 'n', p: 'p', q: 'k', r: 'ɹ', s: 's', t: 't', v: 'v', w: 'w', z: 'z' };
const NAME = { a: 'A', e: 'i', i: 'I', o: 'O', u: 'u' }, VOWELS = 'ɑæaʌɔɒɛɜɪiʊuAIWYOQə';
const SMALL = new Set('a an the of to in on at for and or but is are was were be been am it its this that these those with as by from i you he she we they me my your his her our their do does did not no so if then than too very just can will would could should have has had there here what when where who how'.split(' '));
function sounds(word) {
  const out = [], put = s => { const long = s.endsWith(':'), ch = long ? s.slice(0, -1) : s, v = VOWELS.includes(ch), z = out[out.length - 1]; if (v || !z || z.ch !== ch) out.push({ ch, v, long }); };
  for (const w of word.toLowerCase().replace(/\d/g, d => ' ' + DIGIT[+d] + ' ').replace(/[^a-z ]/g, '').split(' ').filter(Boolean)) {
    const n = w.length, isV = ch => 'aeiou'.includes(ch);
    for (let i = 0; i < n;) {
      const a = w[i], b = w[i + 1] || '', two = a + b, rest = w.slice(i);
      if (rest.startsWith('igh')) { put('I:'); i += 3; }
      else if (rest.startsWith('tch')) { put('ʧ'); i += 3; }
      else if (rest === 'tion' || rest === 'sion') { put('ʃ'); put('ə'); put('n'); i += 4; }
      else if (rest === 'le' && i > 0) { put('ə'); put('l'); i += 2; }
      else if (rest === 'ed' && i > 0 && !'td'.includes(w[i - 1])) { put('d'); i += 2; }                        // "asked": no extra syllable
      else if (PAIR[two] && !(two === 'er' && i === 0)) { PAIR[two].forEach(put); i += 2; }
      else if (isV(a) && b && !isV(b) && i + 2 === n - 1 && w[n - 1] === 'e') { put(NAME[a] + ':'); i += 1; }      // "make", "time": the vowel says its name
      else if (a === 'e' && i === n - 1 && n > 2 && /[aeiouy]/.test(w.slice(0, -1))) i += 1;                      // a final e is silent
      else if (a === 'y') { put(i === 0 ? 'j' : i === n - 1 ? (n <= 3 ? 'I:' : 'i') : 'ɪ'); i += 1; }
      else if (a === 'c') { put('eiy'.includes(b) && b ? 's' : 'k'); i += 1; }
      else if (a === 'g') { put('eiy'.includes(b) && b ? 'ʤ' : 'ɡ'); i += 1; }
      else if (a === 'x') { put('k'); put('s'); i += 1; }
      else { if (ONE[a]) put(ONE[a]); i += 1; }
    }
  }

}
/* Lays a line out in time: every sound with a start and a length, the words for the caption, a little invented melody
   (the voice falls through a sentence and lifts on some stressed words) so that nods and brows have something to follow.
   This is a plan. The voice that actually speaks will be a little faster or slower, and the clock below corrects for it. */
function plan(text) {
  const toks = text.trim().split(/\s+/).filter(Boolean), items = [], words = []; let at = 0, letters = 0;
  toks.forEach((tok, k) => {
    const core = tok.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, ''), end = (tok.match(/[,.;:!?…]+$/) || [''])[0], small = SMALL.has(core.toLowerCase()), ph = sounds(core);
    if (small) for (const p of ph) if (p.v && !p.long) p.ch = 'ə';                                             // little words are swallowed
    const st = small ? -1 : ph.findIndex(p => p.v); letters += core.replace(/\d/g, 'four').length;
    words.push({ tok, i: items.length, c: at }); at += tok.length + 1;
    ph.forEach((p, j) => items.push({ ch: p.ch, v: p.v, st: j === st, k, d: p.v ? (p.long ? 0.13 : 0.085) * (j === st ? 1.3 : 1) : 'pbm'.includes(p.ch) ? 0.075 : 'sʃfθʧz'.includes(p.ch) ? 0.085 : 0.06 }));

  });
  let sum = 0; for (const it of items) if (it.ch) sum += it.d;
  if (!sum) return null;
  const scale = clamp(letters / PACE / sum, 0.6, 1.8), seg = [], stress = []; let t = 0.02;
  items.forEach((it, i) => {
    for (const w of words) if (w.i === i) w.t = t;
    if (it.ch) { const d = it.d * scale, loud = it.st ? 0.95 + 0.55 * hash(it.k, 1) : 0.7; if (it.st) { seg.push(['ˈ', t, 0, 0]); stress.push([t + d * 0.4, hash(it.k, 2) < 0.45 ? 3.5 : 0.8]); } seg.push([it.ch, t, d, loud]); t += d; }
    else if (it.stop) { seg.push([it.stop, t, it.d, 0]); t += it.d; } else t += it.d;
  });
  for (const w of words) if (w.t == null) w.t = t;
  const len = t + 0.05, ask = /\?\s*$/.test(text); let f0 = '';
  for (let x = 0; x < len; x += 0.04) { let st = 2 - 4 * x / len + (ask ? 5 * rise(x, len - 0.55, len - 0.12) : 0); for (const [ts, up] of stress) st += up * gauss(x - ts, 0.13); f0 += String.fromCharCode(clamp(Math.round(78 + 2 * st), 58, 112)); }
  return { words: words.map(w => [w.tok, w.t]), chars: words.map(w => w.c), seg, len, f0 };
}

/* ── the engine's timelines, kept going for as long as the page is open ── */
const live = { state: 'loading', n: 0, beat: null, idle: null, stretch: 1, breath: [], until: 0, think: 0, turn: null, cur: -1, seq: 0, history: [] };
// Where the line is. With the avatar's own voice: the audio clock itself, less the time sound takes to leave the device
// (`audio` is when the line's first sample plays). With a borrowed voice: planned time `plan` was reached at wall time
// `at`, and the voice runs `k` times slower than planned.
const sync = { plan: 0, at: 0, k: 1, on: false, line: -1, started: 0, heard: 0, audio: null };
let actx = null; const lag = () => actx ? actx.outputLatency || actx.baseLatency || 0 : 0;
const planned = () => !sync.on ? 0 : sync.audio != null ? actx.currentTime - lag() - sync.audio : sync.plan + (wall() - sync.at) / sync.k;
// Breathing: the engine expects a finished timeline. Here it is finished again whenever something is added: quiet
// breaths up to each breath taken for speech, and on for twenty minutes after the last one.
function breathe() {
  const T = [-8], Y = [0.4]; let n = 0;
  const idle = until => { for (;;) { const k = T.length - 1, up = Y[k] < 0.5, d = (up ? 1.5 : 2.4) * (0.85 + 0.3 * hash(n, WHO.length)); if (T[k] + d > until) return; n++; T.push(T[k] + d); Y.push(up ? 0.62 + 0.08 * hash(n, 3) : 0.34 + 0.06 * hash(n, 5)); } };
  for (const [t, lv] of live.breath) {
    if (lv < 0) { idle(t - 0.3); const k = T.length - 1, up = Y[k] < 0.5, f = clamp((t - T[k]) / (up ? 1.5 : 2.4), 0, 1); T.push(Math.max(t, T[k] + 0.05)); Y.push(up ? Y[k] + 0.2 * f : Y[k] - 0.25 * f); }
    else { T.push(Math.max(t, T[T.length - 1] + 0.02)); Y.push(lv); }
  }
  live.until = clock() + 1200; idle(live.until); BREATH[WHO] = { T, Y, M: slopes(T, Y) };
}
function rest(ts) { live.idle = { who: WHO, start: ts, dur: 1e9, mo: { back: [] } }; live.beat = null; sync.on = false; }
// The voice has reached line i of the reply being spoken (each line is begun once, whichever signal reports it first).
function reach(i, ts) { const L = live.turn; if (!L || !L[i] || live.cur === i) return; live.cur = i; finish(); begin(L[i], ts == null ? clock() : ts); }
// A line begins: its audio starts at ts. The engine builds jaw, lips, nods, brows and posture for it, from the sounds
// and times the voice reported (line.sp) or, for a borrowed voice, from the guess above.
function begin(line, ts) {
  const sp = line.sp || plan(line.text); if (!sp) return;
  const b = { who: WHO, start: ts - PRE, lead: PRE, ai: live.n++, sp, tail: 0.5 };
  // (A reply used to start on a smile. Blended with the rounded lips of a first sound it showed as a second, faint lip
  // corner for a few frames, so the smile now simply lets go before the first word, as it does in the bulletin.)
  BREATH[WHO] = live.breath; buildSpeech(b); live.breath = BREATH[WHO]; breathe();
  if (line.sp) for (let i = 0; i < b.J.length; i++) b.J[i] *= OPEN;
  live.beat = b; sync.plan = 0; sync.at = wall(); sync.k = line.sp ? 1 : live.stretch; sync.on = true; sync.started = wall(); sync.heard = 0; sync.audio = line.when == null ? null : line.when;
}
// A line ends: how long it really took against the plan tells how fast this voice speaks, for the lines that follow.
function finish() {
  const b = live.beat; if (!b || !sync.on || sync.audio != null) return;                                      // nothing to learn from a voice that says its own times
  const took = sync.heard > 0.5 ? sync.heard : wall() - sync.started, meant = b.t1 - PRE;
  if (meant > 0.8 && took > 0.5) live.stretch = clamp(0.5 * live.stretch + 0.5 * took / meant, 0.6, 1.7);
}
// The engine's own face and body, with two things added: what was laid out a moment ago for a sound that has only just
// started is eased in (the smile letting go, the breath), and while a reply is being thought of the eyes go aside.
const face0 = faceAt, body0 = bodyAt, ease1 = { g: 0.5, lift: 0, t: -1 };
faceAt = (id, b, bt, ts, still) => {
  const q = face0(id, b, bt, ts, still), dt = ease1.t < 0 ? 1 : clamp(ts - ease1.t, 0, 1), k = 1 - Math.exp(-dt / 0.14); ease1.t = ts;
  ease1.g += (q.g - ease1.g) * k; q.g = ease1.g;
  live.think += ((live.state === 'thinking' ? 1 : 0) - live.think) * (1 - Math.exp(-dt / 0.2));
  if (live.think > 0.01) { const h = live.think; q.gx += (0.6 - q.gx) * h; q.gy = Math.max(q.gy, 0.22 * h); q.yaw = clamp(q.yaw + 0.16 * h, -1, 1); q.bu = Math.max(q.bu, 0.14 * h); }

/* ── the avatar's own voice ──
   Kokoro, a speech model of 82 million parameters, run on this device by voice/worker.js. For every line it returns the
   audio and the sounds in it with their times, so nothing about the mouth is guessed. It takes a while to arrive
   (92 MB, once) and, on a slow device, longer to make a line than to say it; until it is ready, or if it cannot start
   in this view, a borrowed voice speaks. */
const kk = { state: 'off', gen: 0, pool: [], rtf: 1.2, cps: 15, step: '', got: 0, of: 0, error: '', wait: {}, id: 0, voices: [], threads: 1, need: [], files: { model: null, wasm: null, voices: {} }, kept: null, from: '' };
const GAP = 0.1, SLACK = 0.35, HOLD = 4;       // seconds between two lines; how much longer a pause may get before the start is held back; the longest it is held
// Where the voice's parts come from. Run from a disk or a server of one's own, everything is in the folder voice/ beside
// the page. A page published as a Claude artifact cannot carry the model, so there the two libraries come from a CDN
// and the model and voices are files the viewer adds once; they are kept in this browser (IndexedDB) for the next visit.
const HF = 'https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX-timestamped/resolve/dd4401a9add81ac692d20e240d22ec9dda82cc29/';
const store = {
  open: () => new Promise((ok, no) => { try { const r = indexedDB.open('avatar-voice', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } }),
  // (kept as blobs: a browser stores those as files, where a plain value has a size limit a 326 MB model is over)
  all: async () => { const db = await store.open(), out = await new Promise((ok, no) => { const o = {}, c = db.transaction('f').objectStore('f').openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { o[cur.key] = cur.value; cur.continue(); } else ok(o); }; c.onerror = () => no(c.error); });
    for (const k of Object.keys(out)) if (out[k] instanceof Blob) out[k] = await out[k].arrayBuffer(); return out; },
  put: async (k, v) => { const db = await store.open(); return new Promise((ok, no) => { const t = db.transaction('f', 'readwrite'); t.objectStore('f').put(new Blob([v]), k); t.oncomplete = () => ok(); t.onerror = t.onabort = () => no(t.error || new Error('not stored')); }); },
  // one model at a time is kept: a new one replaces the old
  drop: async keep => { const db = await store.open(); return new Promise((ok, no) => { const t = db.transaction('f', 'readwrite'), o = t.objectStore('f'), r = o.getAllKeys(); r.onsuccess = () => { for (const k of r.result) if (/\.onnx$/i.test(k) && k !== keep) o.delete(k); }; t.oncomplete = () => ok(); t.onerror = t.onabort = () => no(t.error); }); },
};
// a file the viewer chose, by what its name ends in: the model, the runtime's WebAssembly, or a voice
function take(name, buf) {
  const f = kk.files; name = name.replace(/^.*[\\/]/, '');
  if (/\.onnx$/i.test(name)) f.model = buf; else if (/\.wasm$/i.test(name) && /jspi|asyncify/i.test(name)) f.gpuWasm = { kind: /jspi/i.test(name) ? 'jspi' : 'asyncify', buf }; else if (/\.wasm$/i.test(name)) f.wasm = buf; else if (/\.bin$/i.test(name) && buf.byteLength % 1024 === 0 && buf.byteLength < 4e6) f.voices[name.replace(/( \(\d+\))?\.bin$/i, '')] = buf; else return false;
  return true;
}
function ownVoice() {
  const base = new URL('voice/', document.baseURI).href; kk.state = 'loading'; note();
  const lost = why => { kk.state = 'failed'; kk.error = why; voiceList(); note(); };
  // On the processor one worker makes one line at a time on one core (more needs a kind of page this is not). So where
  // the device has the cores and the memory, a second and a third are started, each handed the model the one before it
  // used. On a GPU one worker is enough: the GPU is where the work is done.

async function reply(text, part) {
  if (!io.sample) return /[A-Za-z]{2}/.test(text) ? text : "Type a sentence and I will say it.";                 // no Claude in this view: the words typed are the words spoken
  const msgs = [{ role: 'user', content: PERSONA + (slow() ? ' Keep every answer to one short sentence.' : '') }, { role: 'assistant', content: 'Understood.' }].concat(live.history.slice(-12));
  const ctl = live.ctl = new AbortController();
  try { const r = await io.sample(msgs, { modelTier: 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => part(text) }); return (r.text || '').trim(); }
  catch (e) { return e && e.text ? e.text.trim() : e && e.code === 'rate_limited' ? 'I need a moment before I can answer again.' : e && e.code === 'cancelled' ? '' : "I couldn't get an answer just now."; }
}
// A reply is spoken a sentence at a time; a long sentence is cut once more at a comma, so its first words come sooner
// (sooner still when two workers can make the halves side by side). On a device that makes speech slower than it is
// spoken even so, Claude is asked for one sentence.
const slow = () => mode() === 'own' && kk.rtf / Math.max(1, kk.pool.length) > 1;
function cut(answer) {
  const out = [];
  for (const s of answer.match(/[^.!?…]+[.!?…]*\s*/g) || [answer]) {
    const t = s.trim(), long = slow() || (mode() === 'own' && kk.pool.length > 1) ? 64 : 110; if (!/[A-Za-z0-9]/.test(t)) continue;
    const at = []; for (let i = 24; i < t.length - 24; i++) if (/[,;:—]/.test(t[i]) && t[i + 1] === ' ') at.push(i + 1);
    if (t.length > long && at.length) { const m = at.reduce((a, b) => Math.abs(b - t.length / 2) < Math.abs(a - t.length / 2) ? b : a); out.push({ text: t.slice(0, m).trim() }, { text: t.slice(m).trim() }); } else out.push({ text: t });
  }

}
async function turn(text) {
  text = text.trim(); if (!text) return;
  hush(); const my = live.seq; if (live.beat) { finish(); rest(clock()); }                                    // a new question cuts the answer off
  say('You', text); live.history.push({ role: 'user', content: text });
  if (live.idle) live.idle.mo.back.push([clock() - live.idle.start + 0.25, 0.6]);                              // a small nod: heard you
  setState('thinking', 'Thinking'); $('cap').textContent = '';
  // just before the first sound: the smile lets go and a breath goes in, as they would
  const span = [1e9, 1e9]; let begun = false;
  const prep = () => { if (begun || my !== live.seq) return; begun = true; const ts = clock(); span[0] = ts + 0.45; (SPOKE[WHO] = SPOKE[WHO] || []).push(span); live.breath.push([ts, -1], [ts + 0.4, 1]); breathe(); setState('speaking', 'Speaking'); };
  // With its own voice the avatar starts on the first sentence while Claude is still writing the rest: each finished
  // sentence goes to the voice as it appears. A borrowed voice needs the whole reply first.
  const lines = [], own = mode() === 'own', tidy = s => s.replace(/[*_#`]/g, '').slice(0, 600); let used = 0, talker = null, shown = null;
  live.turn = lines; live.cur = -1;
  const take = (whole, last) => {
    if (my !== live.seq) return; whole = tidy(whole);
    if (io.sample) { if (!shown) shown = say('Avatar', whole); else shown(whole); }
    let upto = whole.length; if (!last) { upto = used; const re = /[.!?…]+["')\]]*\s/g; re.lastIndex = used; for (let m; (m = re.exec(whole));) upto = m.index + m[0].length; }
    if (upto <= used) return; const fresh = cut(whole.slice(used, upto)); used = upto;
    for (const l of fresh) { if (!lines.length) l.first = true; lines.push(l); if (own) { talker = talker || ownTalker(lines, prep); talker.add(l); } }
  };
  const answer = tidy(await reply(text, whole => take(whole, false))) || (lines.length ? '' : 'Sorry, say that again?');
  if (my !== live.seq) return;                                                                                // something newer was asked meanwhile
  if (answer) take(answer, true);
  live.history.push({ role: 'assistant', content: answer || lines.map(l => l.text).join(' ') });
  if (!lines.length) { settled(); return; }
  try { if (talker) { talker.end(); await talker.done; } else await speak(lines, prep); } catch (e) {}
  if (begun) span[1] = clock(); if (my !== live.seq) return;
  finish(); io.lastLines = lines; live.turn = null; rest(clock()); settled();
}
$('talk').addEventListener('submit', e => { e.preventDefault(); const v = $('say').value; $('say').value = ''; sound();
  if (io.voice === 'browser' && !io.tts && !io.unlocked) { io.unlocked = true; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (x) {} }      // some browsers only speak after a first tap
  turn(v); });
$('stop').onclick = () => { hush(); finish(); rest(clock()); settled(); };

/* ── picture ── */
function frame() {
  const ts = clock(), a = ACT[WHO];
  if (pending > 0) { requestAnimationFrame(frame); return; }
  if (live.state === 'loading') { rest(ts); breathe(); setState('idle', 'Ready'); }
  if (ts > live.until - 120) breathe();                          // keep the quiet breathing going
  if (live.q && live.turn === live.q.lines) {                    // the avatar's own voice: a line's mouth begins when its audio is about to be heard
    const L = live.turn, heard = actx.currentTime - lag();
    for (let k = live.cur + 1; k < L.length; k++) { const l = L[k]; if (l.skip) continue; if (l.when != null && heard >= l.when - PRE - 0.03) reach(k, ts + l.when - heard); break; }
  }
  const b = live.beat || live.idle, bt = live.beat ? PRE + planned() : ts - live.idle.start, f = a.m.face;
  c.setTransform(1, 0, 0, 1, -clamp(f.cx - 384, 0, FW - 768), 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  drawActor(WHO, ts, { b, bt, zb: 1, zf: 1.02 });
  if (live.beat) {                                                // the caption: the line, with the words said so far in full ink
    let n = 0; while (n < b.wt.length && b.wt[n] <= bt) n++;
    if (frame.n !== n || frame.b !== b) { frame.n = n; frame.b = b; const el = $('cap'), said = document.createElement('b'); said.textContent = b.words.slice(0, n).join(' '); el.textContent = ''; el.append(said, n ? ' ' : '', b.words.slice(n).join(' ')); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ── what this view of the page can do ── */
(async () => {
  const use = n => window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  $('note').textContent = FACE.note;
  use('sample').then(s => { io.sample = s; note(); });
  use('tts').then(t => {
    if (t) { io.tts = t;
      // Three signals say where a borrowed voice is: a line starting, the voice starting at all (then it is on the first
      // line), and the position within a line (which starts again from nothing when the next line begins).
      t.onLine(({ line, id }) => reach(id != null ? +String(id).slice(1) : +line));
      t.onState(({ state }) => { if (state === 'speaking' && live.cur < 0) reach(0); });
      t.onPosition(({ ms }) => { if (live.cur < 0) reach(0); if (!sync.on || sync.audio != null) return; const at = ms / 1000; if (at < sync.heard - 0.3) reach(live.cur + 1); sync.heard = at; sync.plan = at / sync.k; sync.at = wall(); }); }
    voiceList(); note();
  });
  // Hands-free. One click starts listening and it stays open (the platform allows an hour): what is said is sent after
  // a short silence, the avatar answers, and it is listening again. Speaking over the avatar interrupts it.
  // The microphone also hears the avatar's own voice from a loudspeaker. So while the avatar is thinking or speaking,
  // and for a moment after, what is heard is compared with what the avatar is saying: words it is saying are its own
  // voice coming back and are ignored; words it is not saying are the viewer, and stop it.
  use('dictation').then(d => {
    if (!d) return; io.dictation = d; const mic = $('mic'); mic.hidden = false; let heard = '', timer = 0;
    const busy = () => live.state === 'speaking' || live.state === 'thinking' || wall() < io.deafUntil;
    const words = t => t.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
    const viewer = text => {
      const w = words(text); if (!w.length) return false;
      const own = new Set(); for (const L of [live.turn, io.lastLines]) if (L) for (const l of L) for (const x of words(l.text)) own.add(x);
      const novel = w.filter(x => !own.has(x));
      return (novel.length >= 2 && novel.length >= 0.5 * w.length) || (novel.length >= 1 && w.length <= 3 && novel.some(x => CUT.has(x)));
    };
    const interrupt = () => { hush(); if (live.beat) { finish(); rest(clock()); } io.deafUntil = 0; io.lastLines = null; setState('listening', 'Listening'); };
    const join = (a, b) => (a && b && !/^\s/.test(b) ? a + ' ' + b : a + b).trimStart();                          // a settled piece brings its own leading space when it needs one
    const send = () => { clearTimeout(timer); timer = 0; const v = heard.trim(); heard = ''; if (!v || (busy() && !viewer(v))) return; $('say').value = ''; turn(v); };
    const soon = () => { clearTimeout(timer); timer = setTimeout(send, PAUSE * 1000); };
    io.forget = () => { clearTimeout(timer); timer = 0; heard = ''; $('say').value = ''; };                       // called when the avatar stops speaking
    // true if this piece is to be used; stops the avatar first if it was the viewer speaking over it
    const mine = text => { if (!busy()) return true; if (!viewer(join(heard, text))) return false; interrupt(); return true; };
    d.onPartial(({ text }) => { if (!mine(text)) return; $('say').value = join(heard, text); if (text) clearTimeout(timer); else if (heard) soon(); });      // still talking: wait
    d.onFinal(({ text }) => { if (!mine(text)) return; heard = join(heard, text); $('say').value = heard; soon(); });
    d.onState(({ state }) => { const on = state === 'listening'; mic.setAttribute('aria-pressed', on); mic.textContent = on ? 'Listening · stop' : 'Speak';
      if (on) { if (live.state === 'idle') setState('listening', 'Listening'); } else if (state === 'idle') { if (heard) send(); if (live.state === 'listening') setState('idle', 'Ready'); } });
    mic.onclick = () => { sound(); if (d.active()) d.stop().catch(() => {}); else { heard = ''; d.start().catch(() => {}); } };
  });
  voiceList(); note(); ownVoice();
})();
